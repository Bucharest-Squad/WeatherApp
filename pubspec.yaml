name: weather_app
description: "A simple weather app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  get_it: ^8.2.0
  dio: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.0
  flutter_gen_runner: ^5.12.0

flutter_gen:
  output: lib/gen/

  integrations:
    flutter_svg: true

  assets:
    enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist.ttf

# Important command before build
# dart run build_runner build --delete-conflicting-outputs